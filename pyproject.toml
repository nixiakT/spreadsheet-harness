[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "spreadsheet-agent-harness"
version = "0.1.0"
description = "Linux-first multimodal spreadsheet agent harness with LibreOffice rendering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Spreadsheet Harness Contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1.5,<4",
  "pandas>=2.1,<4",
  "Pillow>=10,<13",
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6,<7",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
sheet-harness = "spreadsheet_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spreadsheet_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
